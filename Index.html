<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Alina 💕</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
      font-family: 'Georgia', serif;
    }

    .card {
      background: #fff0f5;
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(255, 105, 180, 0.3);
    }

    h1 {
      color: #c2185b;
      font-size: 2.6em;
      margin-bottom: 10px;
    }

    p {
      color: #7a1f44;
      font-size: 1.2em;
      line-height: 1.6;
    }

    .heart {
      font-size: 3em;
      animation: pulse 1.5s infinite;
      margin-bottom: 10px;
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      padding: 12px 28px;
      font-size: 1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background: #ff4d88;
      color: white;
    }

    .no {
      background: #f8a1c4;
      color: white;
    }

    .secret {
      display: none;
      margin-top: 25px;
      font-size: 1.3em;
      color: #ad1457;
      animation: fadeIn 1.5s forwards;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">💗</div>
    <h1>Alina, Will You Be My Valentine?</h1>

    <p>
      Every moment with you feels like a love story I never want to stop reading.
      You make my world softer, warmer, and more beautiful.
    </p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💖</button>
      <button class="no" onclick="sayNo()">No 🙈</button>
    </div>

    <div class="secret" id="secretMessage">
      💌 Alina, my heart chose you a long time ago.  
      Every smile of yours makes me fall in love all over again.  
      I love you endlessly 💕
    </div>
  </div>

  <script>
    function sayYes() {
      document.getElementById("secretMessage").style.display = "block";
    }

    function sayNo() {
      alert("Are you sure? My heart says YES for you 💔😉");
    }
  </script>

</body>
</html>
